services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: factory-os-v2:latest
    container_name: factory-os-v2-app
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "3000"
    volumes:
      - factory_os_data:/app/data
    networks:
      - proxy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/uz/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  factory_os_data:

networks:
  proxy:
    external: true
    name: quwandiq-backend_internal
